<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NubArca</title>
    <meta
      name="description"
      content="NubArca — your files, your hardware, your private cloud. Photos, videos and documents on storage you own."
    />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="application-name" content="NubArca" />
    <meta name="apple-mobile-web-app-title" content="NubArca" />

    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/app-icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Theme bootstrap — runs BEFORE the stylesheet paints and before React
      // mounts, so a light-theme flash is impossible. It mirrors, verbatim, the
      // rules in src/theme/themePreference.ts:
      //   * key 'nubarca.theme' holds exactly 'dark' | 'light' | 'system'
      //   * absent => fall back ONCE to the pre-rebrand 'nanocloud.theme',
      //     migrate a valid value forward, then drop the old key
      //   * anything else (missing, stale, unreadable) => 'dark' (the default)
      //   * 'system' asks for prefers-color-scheme: light, so "no preference"
      //     still resolves to dark
      // ThemeProvider re-applies the same value on mount, which is a no-op.
      // The migration has to live HERE as well as in the module: this script
      // decides the FIRST paint, so without it a returning light-theme user
      // would flash dark before React could read the old key.
      (function () {
        var effective = 'dark';
        try {
          var valid = function (v) {
            return v === 'dark' || v === 'light' || v === 'system' ? v : null;
          };
          var preference = valid(window.localStorage.getItem('nubarca.theme'));
          if (preference === null) {
            var legacyRaw = window.localStorage.getItem('nanocloud.theme');
            if (legacyRaw !== null) {
              preference = valid(legacyRaw);
              if (preference !== null) {
                window.localStorage.setItem('nubarca.theme', preference);
              }
              window.localStorage.removeItem('nanocloud.theme');
            }
          }
          if (preference === null) preference = 'dark';
          if (preference === 'system') {
            effective =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          } else {
            effective = preference;
          }
        } catch (e) {
          // Blocked storage / private mode: keep the default.
        }
        document.documentElement.dataset.theme = effective;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
